<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReserveHub — Modern Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-blob blob-1"></div>
  <div class="background-blob blob-2"></div>

  <header class="navbar">
    <div class="logo">Reserve<span>Hub</span></div>
    
    <div style="display: flex; align-items: center; gap: 1.25rem;">
      <a href="admin.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none; font-weight: 500;">
        Owner Portal 🔒
      </a>

      <div id="nav-user" class="hidden">
        <span id="nav-username"></span>
        <button id="logout-btn" class="btn btn-secondary">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- AUTH CARD (Login / Register) -->
    <div id="auth-section" class="card auth-card">
      <div class="tabs">
        <button id="tab-login" class="tab-btn active" type="button">Sign In</button>
        <button id="tab-register" class="tab-btn" type="button">Sign Up</button>
      </div>

      <!-- Sign In Form -->
      <form id="login-form" class="form-flow">
        <h2>Welcome back</h2>
        <p class="subtitle">Enter your credentials to access your bookings.</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@domain.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Sign In</button>
      </form>

      <!-- Sign Up Form -->
      <form id="register-form" class="form-flow hidden">
        <h2>Create an account</h2>
        <p class="subtitle">Bookings made simple, transparent, and fast.</p>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="you@domain.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="At least 6 characters" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Create Account</button>
      </form>
    </div>

    <!-- DASHBOARD (Visible when logged in) -->
    <div id="dashboard-section" class="hidden dashboard-grid">
      <!-- Booking Form -->
      <div class="card booking-card">
        <h3>Make a Reservation</h3>
        <p class="subtitle">Lock in your next date and time instantly.</p>
        
        <form id="reservation-form">
          <div class="form-group">
            <label>Occasion / Title</label>
            <input type="text" id="res-title" placeholder="e.g. Dinner Meeting, Workspace" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="res-date" required />
            </div>
            <div class="form-group">
              <label>Time</label>
              <input type="time" id="res-time" required />
            </div>
          </div>
          <div class="form-group">
            <label>Guests</label>
            <input type="number" id="res-guests" min="1" max="50" value="1" required />
          </div>
          <div class="form-group">
            <label>Notes (Optional)</label>
            <textarea id="res-notes" rows="2" placeholder="Dietary needs, preferred seating..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary full-width">Confirm Reservation</button>
        </form>
      </div>

      <!-- Reservations List -->
      <div class="card list-card">
        <h3>Your Reservations</h3>
        <p class="subtitle">Upcoming schedule and history.</p>
        <div id="reservations-container" class="reservations-container">
          <!-- Injected dynamically -->
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
